<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>SVG Diagram Framework</title>
	<style>
		body {
			font-family: sans-serif;
			margin: 20px;
		}

		svg {
			border: 1px solid #ccc;
			width: 800px;
			height: 500px;
			display: block;
			margin-bottom: 10px;
		}

		button {
			margin-right: 10px;
			padding: 5px 10px;
		}
	</style>
</head>

<body>

	<svg id="diagram"></svg>
	<button id="saveBtn">Save Positions</button>
	<button id="toggleDarkBtn">Toggle Dark/Light Mode</button>
	<button id="exportSvgBtn">Export SVG</button>
	<script type="module">
		import { Diagram, Box, Box2, LineConnector } from './drawClass.js';

		const svg = document.getElementById("diagram");
		const diagram = new Diagram(svg);

		// Demo JSON data
		const diagramData = {
  "objects": [
    {
      "x": 18,
      "y": 19,
      "w": 200,
      "h": 50,
      "color": "lightgray",
      "showEye": null,
      "showArrowDown": null,
      "showArrowUp": null,
      "showArrowRight": null,
      "cutColor": "red",
      "type": "Box",
      "id": "box1"
    },
    {
      "x": 220,
      "y": 255,
      "w": 120,
      "h": 70,
      "color": "lightgray",
      "showEye": true,
      "showArrowDown": true,
      "showArrowUp": true,
      "showArrowRight": true,
      "cutColor": "green",
      "type": "Box",
      "id": "box2"
    },
    {
      "objectName": "obj1",
      "x": 50,
      "y": 199,
      "w": 120,
      "h": 70,
      "color": "lightgray",
      "showEye": true,
      "showArrowDown": true,
      "showArrowUp": true,
      "showArrowRight": null,
      "cutColor": "purple",
      "type": "Box",
      "id": "box3"
    },
    {
      "objectName": "obj2",
      "x": 217,
      "y": 115,
      "w": 120,
      "h": 70,
      "color": "lightgray",
      "showEye": true,
      "showArrowDown": true,
      "showArrowUp": true,
      "showArrowRight": null,
      "cutColor": "purple",
      "type": "Box",
      "id": "box4"
    },
    {
      "objectName": "box1",
      "x": 185,
      "y": 355,
      "w": 120,
      "h": 70,
      "color": "lightgray",
      "showEye": true,
      "showArrowDown": true,
      "showArrowUp": true,
      "showArrowRight": null,
      "cutColor": "purple",
      "type": "Box",
      "id": "box3"
    },
    {
      "objectName": "box2",
      "x": 400,
      "y": 115,
      "w": 120,
      "h": 70,
      "color": "lightgray",
      "showEye": true,
      "showArrowDown": true,
      "showArrowUp": true,
      "showArrowRight": null,
      "cutColor": "purple",
      "type": "Box",
      "id": "box5"
    },
    {
      "x": 633,
      "y": 227,
      "w": 120,
      "h": 70,
      "color": "#ddd",
      "showEye": true,
      "showArrowDown": true,
      "showArrowUp": true,
      "showArrowRight": true,
      "objectName": "box1",
      "cutColor": null,
      "type": "Box",
      "id": "box7"
    },
    {
      "x": 378,
      "y": 355,
      "w": 120,
      "h": 70,
      "color": "#ddd",
      "showEye": true,
      "showArrowDown": true,
      "showArrowUp": true,
      "showArrowRight": true,
      "objectName": "child of box1",
      "cutColor": null,
      "type": "Box2",
      "id": "box8"
    },
    {
      "x": 650,
      "y": 115,
      "w": 120,
      "h": 70,
      "color": "#ddd",
      "showEye": true,
      "showArrowDown": true,
      "showArrowUp": true,
      "showArrowRight": true,
      "objectName": "child of box2",
      "id": "box9",
      "cutColor": null,
      "type": "Box2"
    }
  ],
  "connectors": [
    {
      "id": "conn1",
      "from": "box1",
      "to": "box2",
      "type": "LineConnector"
    },
    {
      "id": "conn2",
      "from": "box2",
      "to": "box3",
      "type": "LineConnector"
    },
    {
      "id": "conn3",
      "from": "box1",
      "to": "box3",
      "type": "LineConnector"
    },
    {
      "id": "conn4",
      "from": "box3",
      "to": "box7",
      "type": "LineConnector"
    },
    {
      "id": "conn5",
      "from": "box3",
      "to": "box8",
      "type": "LineConnector"
    },
    {
      "id": "conn6",
      "from": "box5",
      "to": "box9",
      "type": "LineConnector"
    }
  ]
};
		const objMap = {};
		for (let o of diagramData.objects) {
			
			if (o.type === "Box2") {
				const box = diagram.addObject(
					new Box2({
						svg: svg,
						diagram: diagram,
						...o, // spread all fields from the data object
					}));
				objMap[o.id] = box;
			} else {
const box = diagram.addObject(
					new Box({
						svg: svg,
						diagram: diagram,
						...o, // spread all fields from the data object
					}));
				objMap[o.id] = box;
			}
		}

		// Then, create connectors
		for (let c of diagramData.connectors) {
			const { id, from, to, ...rest } = c;
			diagram.addConnector(
				new LineConnector({
					svg: svg,
					id: c.id,
					fromObj: objMap[c.from],
					toObj: objMap[c.to],
					...rest
				})
			);
		}


		// ===== SAVE TO CLIPBOARD =====
		document.getElementById("saveBtn").addEventListener("click", async () => {
			const saved = {
				objects: diagram.objects.map(o => {
					// destructure o.param safely, skip cyclic references
					const { diagram, svg, ...rest } = o.param || {};
					return {
						...rest,
						id: o.id,
						x: o.x,
						y: o.y,
						w: o.w,
						h: o.h,
						color: o.shape.getAttribute("fill"),
						showEye: o.showEye || null,
						showArrowDown: o.showArrowDown || null,
						showArrowUp: o.showArrowUp || null,
						showArrowRight: o.showArrowRight || null,
						cutColor: o.cutColor || null,
						type: o.type || null
					};
				}),
				connectors: diagram.connectors.map(c => ({
					id: c.id,
					from: c.fromObj.id,
					to: c.toObj.id,
					type: c.type || null
				}))
			};

			const jsonStr = JSON.stringify(saved, null, 2);

			try {
				await navigator.clipboard.writeText(jsonStr);
				alert("Diagram JSON copied to clipboard!");
			} catch (err) {
				console.error(err);
				alert("Failed to copy JSON.");
			}
		});

		// ===== DARK MODE =====
		let manualDarkMode = null; // null = follow system, true/false = forced mode

		const applyDarkMode = (isDark) => {
			diagram.svg.style.background = isDark ? "#1e1e1e" : "#fff";

			for (let box of diagram.objects) {
				box.shape.setAttribute("stroke", isDark ? "white" : "black");

				if (box.cutLine) {
					// Only override stroke if cutColor is not set
					if (!box.cutColor) {
						box.cutLine.setAttribute("stroke", isDark ? "white" : "black");
					}
				}
			}
		};

		const toggleDarkMode = () => {
			if (manualDarkMode === null) {
				manualDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
			}
			manualDarkMode = !manualDarkMode;
			applyDarkMode(manualDarkMode);
		};

		document.getElementById("toggleDarkBtn").addEventListener("click", toggleDarkMode);

		// Listen for system preference changes if manual mode is not set
		const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
		darkQuery.addEventListener("change", () => {
			if (manualDarkMode === null) applyDarkMode(darkQuery.matches);
		});

		// Apply initial mode
		applyDarkMode(darkQuery.matches);

		// ===== EXPORT SVG FILE =====
		document.getElementById("exportSvgBtn").addEventListener("click", () => {
			const serializer = new XMLSerializer();
			let svgStr = serializer.serializeToString(svg);

			// ensure proper SVG namespace
			if (!svgStr.match(/^<svg[^>]+xmlns="http:\/\/www\.w3\.org\/2000\/svg"/)) {
				svgStr = svgStr.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
			}

			// add XML header for compatibility
			const fullSvg = '<?xml version="1.0" standalone="no"?>\n' + svgStr;

			// create downloadable blob
			const blob = new Blob([fullSvg], { type: "image/svg+xml;charset=utf-8" });
			const url = URL.createObjectURL(blob);

			// trigger download
			const a = document.createElement("a");
			a.href = url;
			a.download = "diagram.svg";
			a.click();
			URL.revokeObjectURL(url);
		});

	</script>

</body>

</html>
