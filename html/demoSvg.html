<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>SVG Diagram Framework</title>
	<style>
		body {
			font-family: sans-serif;
			margin: 20px;
		}

		svg {
			border: 1px solid #ccc;
			width: 800px;
			height: 800px;
			display: block;
			margin-bottom: 10px;
		}

		button {
			margin-right: 10px;
			padding: 5px 10px;
		}
	</style>
</head>

<body>

	<svg id="diagram"></svg>
	<button id="saveBtn">Save Positions</button>
	<button id="toggleDarkBtn">Toggle Dark/Light Mode</button>
	<button id="exportSvgBtn">Export SVG</button>
	<script type="module">
		import { Diagram, Box, Box2, LineConnector, LineConnectorImEx } from './drawClass.js';
		import { loadDiagramData } from './diagramDataLoader.js';

		const svg = document.getElementById("diagram");
		const diagram = new Diagram(svg);

		// demo JSON (only used if replaceWithObjects = false)
	
	
		const replaceWithObjects = true;

		(async () => {
			const diagramData = await loadDiagramData(
				replaceWithObjects
			);

			const objMap = {};
			for (let o of diagramData.objects) {
				const box = diagram.addObject(
					o.type === "Box2" ? new Box2({ svg, diagram, ...o })
						: new Box({ svg, diagram, ...o })
				);
				objMap[o.id] = box;
			}

			for (let c of diagramData.connectors) {
				const { id, from, to, ...rest } = c;
				if (c.type === "LineConnector") {
					diagram.addConnector(
						new LineConnector({
							svg: svg,
							id: c.id,
							fromObj: objMap[c.from],
							toObj: objMap[c.to],
							...rest
						})
					);
				}
				if (c.type === "LineConnectorImEx") {
					diagram.addConnector(
						new LineConnectorImEx({
							svg: svg,
							id: c.id,
							fromObj: objMap[c.from],
							toObj: objMap[c.to],
							...rest
						})
					);
				}
				//
			}
		})();

		// ===== SAVE TO CLIPBOARD =====
		document.getElementById("saveBtn").addEventListener("click", async () => {
			const saved = {
				objects: diagram.objects.map(o => {
					// destructure o.param safely, skip cyclic references
					const { diagram, svg, type, otherFieldObjectMAYDELETE, ...rest } = o.param || {};
					return {
						...rest,
						id: o.id,
						x: o.x,
						y: o.y,
						w: o.w,
						h: o.h,
						color: o.shape.getAttribute("fill"),
						showEye: o.showEye || null,
						showArrowDown: o.showArrowDown || null,
						showArrowUp: o.showArrowUp || null,
						showArrowRight: o.showArrowRight || null,
						cutColor: o.cutColor || null,
						type: o.type || null
					};
				}),
				connectors: diagram.connectors.map(c => {
					const { diagram, id, fromObj, toObj, type, typeTool, otherFieldConnectorMAYDELETE, ...rest } = c.param || {};
					return {
						...rest,
						typeTool: typeTool,
						id: c.id,
						from: c.fromObj.id,
						to: c.toObj.id,
						type: c.type || null,
						fieldsToAdd: c.fieldsToAdd
					};
				})
			};

			const jsonStr = JSON.stringify(saved, null, 2);

			try {
				await navigator.clipboard.writeText(jsonStr);
				alert("Diagram JSON copied to clipboard!");
			} catch (err) {
				console.error(err);
				alert("Failed to copy JSON.");
			}
		});

		// ===== DARK MODE =====
		let manualDarkMode = null; // null = follow system, true/false = forced mode

		const applyDarkMode = (isDark) => {
			diagram.svg.style.background = isDark ? "#1e1e1e" : "#fff";

			for (let box of diagram.objects) {
				box.shape.setAttribute("stroke", isDark ? "white" : "black");

				if (box.cutLine) {
					// Only override stroke if cutColor is not set
					if (!box.cutColor) {
						box.cutLine.setAttribute("stroke", isDark ? "white" : "black");
					}
				}
			}
		};

		const toggleDarkMode = () => {
			if (manualDarkMode === null) {
				manualDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
			}
			manualDarkMode = !manualDarkMode;
			applyDarkMode(manualDarkMode);
		};

		document.getElementById("toggleDarkBtn").addEventListener("click", toggleDarkMode);

		// Listen for system preference changes if manual mode is not set
		const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
		darkQuery.addEventListener("change", () => {
			if (manualDarkMode === null) applyDarkMode(darkQuery.matches);
		});

		// Apply initial mode
		applyDarkMode(darkQuery.matches);

		// ===== EXPORT SVG FILE =====
		document.getElementById("exportSvgBtn").addEventListener("click", () => {
			const serializer = new XMLSerializer();
			let svgStr = serializer.serializeToString(svg);

			// ensure proper SVG namespace
			if (!svgStr.match(/^<svg[^>]+xmlns="http:\/\/www\.w3\.org\/2000\/svg"/)) {
				svgStr = svgStr.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
			}

			// add XML header for compatibility
			const fullSvg = '<?xml version="1.0" standalone="no"?>\n' + svgStr;

			// create downloadable blob
			const blob = new Blob([fullSvg], { type: "image/svg+xml;charset=utf-8" });
			const url = URL.createObjectURL(blob);

			// trigger download
			const a = document.createElement("a");
			a.href = url;
			a.download = "diagram.svg";
			a.click();
			URL.revokeObjectURL(url);
		});

	</script>


</body>

</html>
